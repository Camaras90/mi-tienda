    <h1>Vivero BOOM </h1>
    <p>Promociones por semana de inauguración!</p>
        
    <!-- Aquí mostraremos los productos -->
    <div id="lista-productos">Cargando productos...</div>

    <!-- Cargamos la librería oficial de Supabase para JavaScript -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <script>
        // 1. Configura tus credenciales de Supabase (las que guardaste en el Paso 1)
        const SUPABASE_URL = 'https://sjmhkogomjsazhhhaovz.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_90Sc2W2b1Sedd1Lf5uN1SQ_Nr4o__DR';

        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // 2. Función para ir a buscar los productos a la base de datos
      async function cargarProductos() {
            const contenedor = document.getElementById('lista-productos');
            
            // Consultamos la tabla "productos" y agregamos .order()
            const { data, error } = await supabaseClient
                .from('productos')
                .select('*')
                .order('nombre', { ascending: true }); // <-- AQUÍ ESTÁ EL ORDENAMIENTO

            if (error) {
                contenedor.innerHTML = 'Error al cargar los productos.';
                console.error(error);
                return;
            }

            if (data.length === 0) {
                contenedor.innerHTML = 'No hay productos cargados todavía.';
                return;
            }

            // ... (el resto del código para dibujar las tarjetas sigue igual)
            // 3. Dibujamos los productos en la pantalla
            contenedor.innerHTML = '';
            data.forEach(prod => {
                // Si el producto tiene foto la muestra, si no, muestra un espacio o nada
                let imagenHtml = prod.imagen_url 
                    ? `<img src="${prod.imagen_url}" alt="${prod.nombre}" style="width: 100px; height: 100px; object-fit: cover; border-radius: 4px; margin-bottom: 10px;">` 
                    : '';

                contenedor.innerHTML += `
                    <div class="producto-card" style="border: 1px solid #ddd; padding: 15px; margin-bottom: 10px; border-radius: 6px; background: #f9f9f9;">
                        ${imagenHtml}
                        <h3>${prod.nombre}</h3>
                        <p class="precio">Precio: $${prod.precio}</p>
                        <p>Stock disponible: ${prod.stock}</p>
                        <button onclick="comprar('${prod.nombre}')">Comprar / Consultar</button>
                    </div>
                `;
            });
        }

        // Simulación de compra sin pasarela (por ejemplo, vía WhatsApp)
        function comprar(nombreProducto) {
            alert('¡Genial! Quisieras comprar: ' + nombreProducto + '. (Aquí puedes abrir un enlace de WhatsApp con el pedido).');
        }

        // Ejecutar al cargar la página
        cargarProductos();
    </script>
</body>
</html>
